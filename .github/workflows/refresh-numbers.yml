name: refresh-numbers
on:
  schedule:
    - cron: "20 6 * * *"   # daily, after the oracle's nightly pipeline settles
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh By-the-Numbers from the live oracle
        run: python3 scripts/refresh_numbers.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "numbers: daily refresh from the live oracle"
            git push
          else
            echo "no drift today"
          fi
